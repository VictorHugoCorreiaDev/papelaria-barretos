name: Listar arquivos do servidor

# Workflow temporário e somente leitura: lista o conteúdo de htdocs para
# comparar com o repositório e descobrir o que sobrou de versões antigas.
on: workflow_dispatch

jobs:
  listar:
    runs-on: ubuntu-latest

    steps:
      - name: Listar htdocs via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" \
            -e "set ftp:ssl-allow no; cd htdocs; find .; bye"
